id: 007_multi_edit
fixture: tiny_cpp
user_prompt: |
  Mechanically change FindUser from `bool FindUser(int, User*)` to `std::optional<User> FindUser(int)`. Update include/users.hpp, replace only the FindUser function in src/users.cpp while preserving namespace braces/ListUsers, and replace Tokenize's `User u; bool seen = FindUser(1, &u); (void)seen;` with `(void)FindUser(1);`. Do not introduce external dependencies.

allowed_paths:
  - include/users.hpp
  - src/users.cpp
  - src/parser.cpp

checks:
  # Build + run binary tests. The fixture's stats_test.cpp has a
  # deliberately broken Median (task 008's bug); the test runner
  # prints "checks=N failures=M" and tool_run_check parses it to
  # report tests_passed / verdict to the model.
  - name: build
    cmd: 'set +e; cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -20; rc_cfg=${PIPESTATUS[0]}; cmake --build build -j2 2>&1 | tail -30; rc_build=${PIPESTATUS[0]}; build/tests/tiny_tests 2>&1; rc_test=${PIPESTATUS[0]}; echo "EXIT_CFG=$rc_cfg EXIT_BUILD=$rc_build EXIT_TEST=$rc_test"; [ $rc_cfg -eq 0 ] && [ $rc_build -eq 0 ]'

limits:
  max_turns: 12
  max_tool_calls: 40
  max_changed_files: 3

oracle:
  required_contains:
    - path: include/users.hpp
      text: "std::optional<User> FindUser"
  forbidden_contains:
    - path: include/users.hpp
      text: "bool FindUser"
