id: 005_move_helper
fixture: tiny_cpp
user_prompt: |
  Move the entire IsWhitespace definition (`bool IsWhitespace(char c) { ... }`) so it appears before Tokenize in src/parser.cpp, and remove the old forward declaration. Do not change behavior.

allowed_paths:
  - src/parser.cpp

checks:
  # Build + run binary tests. The fixture's stats_test.cpp has a
  # deliberately broken Median (task 008's bug); the test runner
  # prints "checks=N failures=M" and tool_run_check parses it to
  # report tests_passed / verdict to the model.
  - name: build
    cmd: 'set +e; cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -20; rc_cfg=${PIPESTATUS[0]}; cmake --build build -j2 2>&1 | tail -30; rc_build=${PIPESTATUS[0]}; build/tests/tiny_tests 2>&1; rc_test=${PIPESTATUS[0]}; echo "EXIT_CFG=$rc_cfg EXIT_BUILD=$rc_build EXIT_TEST=$rc_test"; [ $rc_cfg -eq 0 ] && [ $rc_build -eq 0 ]'

limits:
  max_turns: 12
  max_tool_calls: 40
  max_changed_files: 2

oracle:
  # The original code has IsWhitespace forward-declared before
  # Tokenize and defined after. After the move, the definition must
  # appear BEFORE the Tokenize function, and the forward declaration
  # must be gone. We use a positional check so the model can use any
  # valid implementation of IsWhitespace (switch, table, etc.).
  required_position:
    - path: src/parser.cpp
      before: "bool IsWhitespace(char c) {"
      after: "std::vector<Token> Tokenize"
  required_contains:
    - path: src/parser.cpp
      text: "bool IsWhitespace(char c) {"
  forbidden_contains:
    - path: src/parser.cpp
      text: "bool IsWhitespace(char c);"
